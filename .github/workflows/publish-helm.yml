---
name: Publish Helm chart

on:
  push:
    tags:
      - "helm-v*"

permissions:
  contents: read

concurrency:
  group: publish-helm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm chart to GHCR
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      CHART_PATH: charts/whale-auth-tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.5

      - name: Check release version
        run: |
          chart_version=$(helm show chart "$CHART_PATH" | awk '/^version:/ {print $2}')
          if [[ "$GITHUB_REF_NAME" != "helm-v${chart_version}" ]]; then
            echo "::error::Release tag must be helm-v${chart_version} to match Chart.yaml"
            exit 1
          fi

      - name: Validate and package chart
        run: |
          helm dependency build "$CHART_PATH"
          helm lint "$CHART_PATH" --strict \
            --set apiTokenSecret.name=validation-secrets \
            --set altchaSecret.name=validation-secrets
          helm template whale-auth-tools "$CHART_PATH" \
            --set apiTokenSecret.name=validation-secrets \
            --set altchaSecret.name=validation-secrets > /dev/null
          helm package "$CHART_PATH" --destination "$RUNNER_TEMP/helm-packages"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish chart
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          helm push "$RUNNER_TEMP"/helm-packages/*.tgz "oci://ghcr.io/${repository}/charts"

      - name: Log out of GHCR
        if: always()
        run: helm registry logout ghcr.io
